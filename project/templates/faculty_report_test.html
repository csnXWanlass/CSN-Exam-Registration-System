<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty report test (temporary)</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 1.5rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.2rem; }
    input, select, button { font: inherit; padding: 0.35rem 0.5rem; }
    #info { margin: 0.5rem 0; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    pre { padding: 1rem; border: 1px solid rgba(128, 128, 128, 0.5); overflow: auto; max-height: 70vh; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Faculty report test</h1>
  <p>Temporary page. Log in as a faculty member first, then run the request. Delete this file when you’re done.</p>

  <form id="filters">
    <label>q (search text)
      <input type="text" name="q">
    </label>
    <label>session_status
      <select name="session_status">
        <option value="">(any)</option>
        <option>Active</option>
        <option>Cancelled</option>
        <option>Complete</option>
      </select>
    </label>
    <label>reg_status
      <select name="reg_status">
        <option value="">(any)</option>
        <option>Active</option>
        <option>Cancelled</option>
        <option>Complete</option>
      </select>
    </label>
    <label>date_from
      <input type="date" name="date_from">
    </label>
    <label>date_to
      <input type="date" name="date_to">
    </label>
    <button type="submit">Run request</button>
  </form>

  <div id="info"></div>
  <pre id="output">Nothing requested yet.</pre>

  <script>
    const form = document.getElementById('filters');
    const info = document.getElementById('info');
    const output = document.getElementById('output');

    async function runRequest() {
      // Build ?q=...&status=... from the form, leaving out empty fields
      const params = new URLSearchParams();
      for (const [name, value] of new FormData(form)) {
        if (value.trim() !== '') params.set(name, value.trim());
      }
      const query = params.toString();
      const url = '/api/faculty-report' + (query ? '?' + query : '');

      info.textContent = 'GET ' + url + ' ...';
      output.textContent = '';

      try {
        const response = await fetch(url);
        const text = await response.text();   // read as text first, so non-JSON errors are still visible

        info.textContent = 'GET ' + url + '  ->  HTTP ' + response.status + ' ' + response.statusText;

        try {
          output.textContent = JSON.stringify(JSON.parse(text), null, 2);   // pretty-printed JSON
        } catch (parseError) {
          output.textContent = '(response was not JSON)\n\n' + text;        // e.g. a login page or an error page
        }
      } catch (networkError) {
        info.textContent = 'GET ' + url + '  ->  request failed';
        output.textContent = String(networkError);
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();   // stay on this page instead of reloading
      runRequest();
    });

    runRequest();   // run once on load with no filters
  </script>
</body>
</html>
